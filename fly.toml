# Fly.io config for the Canvas Buddy frontend (Next.js 16 standalone).
# Sibling to canvas-buddy-api (the FFmpeg + Flux backend on canvas-buddy-api.fly.dev).

app = "canvas-buddy"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # NEXT_PUBLIC_* env vars are inlined into the client bundle at build time.
  # Edit this if the backend URL changes (or override at deploy with --build-arg).
  [build.args]
    NEXT_PUBLIC_TOOL_API = "https://api.canvasbuddy.io"
    NEXT_PUBLIC_SUPABASE_URL = "https://djibkmgjhrmymstfvlha.supabase.co"
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuY2FudmFzYnVkZHkuaW8k"
    NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
    NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
    NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL = "/app"
    NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL = "/app"
    # Cloudflare Turnstile site key — public, baked into the client bundle.
    # Get from https://dash.cloudflare.com → Turnstile → your site → "Site Key".
    # Leave blank in dev; verification fails open on the backend if not set.
    NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADFLxEzHUsroEZRA"

[env]
  PORT = "3030"
  NODE_ENV = "production"

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
